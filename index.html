<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phenom PM Onboarding Hub</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- SVG Gradient Definition for Lucide Icons -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="phenom-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="var(--phenom-purple)" />
        <stop offset="100%" stop-color="var(--phenom-magenta)" />
      </linearGradient>
    </defs>
  </svg>

  <!-- Global Navigation -->
  <nav class="top-nav" id="top-nav" style="display: none;">
    <div class="nav-brand">
      <a href="#welcome" style="display: flex; align-items: center; text-decoration: none;">
        <img src="phenom-logo.png" alt="Phenom Logo" style="height: 28px;">
      </a>
    </div>
    <div class="nav-links">
      <a href="#welcome" class="nav-link" id="nav-welcome">Home</a>
      <a href="#dashboard" class="nav-link" id="nav-dashboard">Dashboard</a>
      <a href="#products" class="nav-link" id="nav-products">Products</a>
      <a href="#people" class="nav-link" id="nav-people">People</a>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main id="app-content">
    <!-- View will be rendered here dynamically -->
  </main>

  <!-- Application scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
